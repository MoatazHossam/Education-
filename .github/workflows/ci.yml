name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit SHA, with the release in a comment, so a moved tag cannot change what
# runs here; Dependabot (.github/dependabot.yml) proposes new releases (production finding S-15).
# The PostgreSQL service below is the test database only and follows the 16-alpine tag on purpose:
# the database the application ships with is pinned by digest in docker-compose.yml.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  checks:
    name: Lint, typecheck, unit and integration tests
    runs-on: ubuntu-24.04
    # Usually 3–5 minutes; a stuck job stops here instead of after GitHub's 6 hours.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # The journeys in each browser; the accessibility tests run in the Chromium job.
    name: End-to-end (Playwright, ${{ matrix.browser }})
    runs-on: ubuntu-24.04
    needs: checks
    # Usually 4–8 minutes per browser.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            script: test:e2e
          - browser: firefox
            script: test:e2e:firefox
          - browser: webkit
            script: test:e2e:webkit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the browser and its system packages
        # Usually under 2 minutes. Twice (November 2026) the WebKit job hung here for over 20 minutes before any
        # test ran; it now fails after 10, and the job is re-run once (docs/TEST_STRATEGY.md, CI).
        timeout-minutes: 10
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run ${{ matrix.script }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report*
            test-results*
          retention-days: 7

  docker:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t midad:ci .
      - name: Smoke test (configuration guard)
        # The image must refuse to start in production with the sandbox billing provider.
        run: |
          set +e
          out=$(docker run --rm -e NODE_ENV=production -e APP_URL=https://ci.example -e DATABASE_URL=postgres://x@localhost/x -e SYSTEM_DATABASE_URL=postgres://y@localhost/x \
            -e SESSION_SECRET=ci-secret-ci-secret-ci-secret-ci-secret -e DATA_ENCRYPTION_KEY=$(openssl rand -base64 32) \
            -e EMAIL_TRANSPORT=smtp -e SMTP_URL=smtp://localhost -e BILLING_PROVIDER=sandbox -e SANDBOX_WEBHOOK_SECRET=0123456789abcdef \
            midad:ci 2>&1)
          echo "$out"
          echo "$out" | grep -q "sandbox billing provider cannot be used in production"
