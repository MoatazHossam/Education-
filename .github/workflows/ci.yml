name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit SHA, with the release in a comment, so a moved tag cannot change what
# runs here; Dependabot (.github/dependabot.yml) proposes new releases (production finding S-15).
# The PostgreSQL service below is the test database only and follows the 16-alpine tag on purpose:
# the database the application ships with is pinned by digest in docker-compose.yml.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  checks:
    name: Lint, typecheck, unit and integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # The journeys in each browser; the accessibility tests run in the Chromium job.
    name: End-to-end (Playwright, ${{ matrix.browser }})
    runs-on: ubuntu-24.04
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            script: test:e2e
          - browser: firefox
            script: test:e2e:firefox
          - browser: webkit
            script: test:e2e:webkit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run ${{ matrix.script }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report*
            test-results*
          retention-days: 7

  docker:
    name: Container image
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -t midad:ci .
      - name: Smoke test (configuration guard)
        # The image must refuse to start in production with the sandbox billing provider.
        run: |
          set +e
          out=$(docker run --rm -e NODE_ENV=production -e APP_URL=https://ci.example -e DATABASE_URL=postgres://x@localhost/x -e SYSTEM_DATABASE_URL=postgres://y@localhost/x \
            -e SESSION_SECRET=ci-secret-ci-secret-ci-secret-ci-secret -e DATA_ENCRYPTION_KEY=$(openssl rand -base64 32) \
            -e EMAIL_TRANSPORT=smtp -e SMTP_URL=smtp://localhost -e BILLING_PROVIDER=sandbox -e SANDBOX_WEBHOOK_SECRET=0123456789abcdef \
            midad:ci 2>&1)
          echo "$out"
          echo "$out" | grep -q "sandbox billing provider cannot be used in production"
