# Production add-on: the session secret and the data encryption key as Docker secrets (files) instead of values in
# the env file, so they are not in any container's environment (docker inspect, /proc/<pid>/environ):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.secrets.yml \
#     --env-file .env.production up -d
# In the env file, leave SESSION_SECRET and DATA_ENCRYPTION_KEY out and give the files instead:
#   SESSION_SECRET_FILE=./secrets/session_secret
#   DATA_ENCRYPTION_KEY_FILE=./secrets/data_encryption_key
# Compose mounts each file at /run/secrets/<name> with its owner and mode on the host, unchanged, so it must belong
# to the containers' user (uid 1000): chown 1000:1000 secrets/* && chmod 400 secrets/* (docs/DEPLOYMENT_GUIDE.md
# §3.7). The application reads any secret setting from <NAME>_FILE (src/config.ts, FILE_SETTINGS); another one
# (AI_API_KEY, the Paymob keys, ...) is added the same way: a secret below, and its _FILE for the containers that
# get it (tests/unit/compose-env.test.ts lists which).
# The ops scripts (ops/start.sh, ops\start.bat) do not use this file: they read the secrets from the env file.

secrets:
  session_secret:
    file: ${SESSION_SECRET_FILE:?set SESSION_SECRET_FILE to the file that holds the session secret}
  data_encryption_key:
    file: ${DATA_ENCRYPTION_KEY_FILE:?set DATA_ENCRYPTION_KEY_FILE to the file that holds the data encryption key}

x-app-secrets: &app-secrets
  secrets: [session_secret, data_encryption_key]
  environment:
    SESSION_SECRET_FILE: /run/secrets/session_secret
    DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key

services:
  app: *app-secrets
  app2: *app-secrets
  # The worker signs no sessions: it gets the encryption key only.
  worker:
    secrets: [data_encryption_key]
    environment:
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
