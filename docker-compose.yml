# Local development / single-host stack:
#   cp .env.docker.example .env.docker && docker compose --env-file .env.docker up --build
# Production adds docker-compose.prod.yml (Caddy TLS proxy, a second app instance, no Mailpit).
# ops/start.sh (Linux) and ops\start.bat (Windows) start either one (docs/DEPLOYMENT_GUIDE.md §8).
name: midad

# Every container's log is capped (5 files of 10 MB), so logs cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# Every setting the app reads (src/config.ts) can be set in the env file; empty means the default.
# Each container gets only the settings it needs (production finding S-9), so one that is broken
# into gives away only its own: migrate gets the schema owner's database and no application
# secret; the worker gets no SESSION_SECRET and no payment or AI keys; only the app instances get
# those, and they do not get the schema owner's password. The backup role's password goes to the
# postgres service only, which creates the roles.

# Every Node container.
x-env-base: &env-base
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_SSL: ${DATABASE_SSL:-}

# migrate: migrations and the catalogue seed, as the schema owner, then grants to the runtime roles.
x-env-migrate: &env-migrate
  <<: *env-base
  MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://${DB_OWNER_USER}:${DB_OWNER_PASSWORD}@postgres:5432/${DB_NAME}}
  APP_DB_ROLE: ${DB_APP_USER}
  SYSTEM_DB_ROLE: ${DB_SYSTEM_USER:-midad_system}
  BILLING_CURRENCY: ${BILLING_CURRENCY:-EGP}

# The app instances and the worker.
x-env-runtime: &env-runtime
  <<: *env-base
  APP_URL: ${APP_URL:-http://localhost:3000}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  # The bundled postgres service by default. For a managed database, set DATABASE_URL,
  # MIGRATION_DATABASE_URL and DATABASE_SSL=true in the env file and start without the
  # bundled one (--scale postgres=0; the ops scripts do this when DATABASE_URL is set).
  DATABASE_URL: ${DATABASE_URL:-postgres://${DB_APP_USER}:${DB_APP_PASSWORD}@postgres:5432/${DB_NAME}}
  # The system role (BYPASSRLS) for cross-tenant work; the app role above never bypasses row-level security.
  SYSTEM_DATABASE_URL: ${SYSTEM_DATABASE_URL:-postgres://${DB_SYSTEM_USER:-midad_system}:${DB_SYSTEM_PASSWORD}@postgres:5432/${DB_NAME}}
  SYSTEM_DATABASE_POOL_MAX: ${SYSTEM_DATABASE_POOL_MAX:-}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
  # Decrypts two-factor secrets (app) and webhook signing secrets (both).
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY}
  DATA_ENCRYPTION_KEYS_PREVIOUS: ${DATA_ENCRYPTION_KEYS_PREVIOUS:-}
  WEBHOOK_ALLOW_INSECURE_TARGETS: ${WEBHOOK_ALLOW_INSECURE_TARGETS:-false}
  # The worker sends the queued emails; the app sends operational alerts (by email too).
  EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  EMAIL_FROM: ${EMAIL_FROM:-Midad <no-reply@localhost>}
  BILLING_PROVIDER: ${BILLING_PROVIDER:-sandbox}
  BILLING_CURRENCY: ${BILLING_CURRENCY:-EGP}
  TRIAL_DAYS: ${TRIAL_DAYS:-}
  GRACE_DAYS: ${GRACE_DAYS:-}
  RENEWAL_NOTICE_DAYS: ${RENEWAL_NOTICE_DAYS:-}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
  # The worker's pass; the app's alert checks also use it to tell a stopped worker.
  WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-}
  # Virus scan of homework files (docs/CLASSROOM.md §5); production turns it on (docker-compose.prod.yml).
  FILE_SCAN: ${FILE_SCAN:-off}
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  CLAMAV_PORT: ${CLAMAV_PORT:-}

# The app instances: sessions and forms, payments, AI.
x-env-web: &env-web
  <<: *env-runtime
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  SALES_EMAIL: ${SALES_EMAIL:-}
  SANDBOX_WEBHOOK_SECRET: ${SANDBOX_WEBHOOK_SECRET:-}
  PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-}
  PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY:-}
  PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-}
  PAYMOB_INTEGRATION_IDS: ${PAYMOB_INTEGRATION_IDS:-}
  PAYMOB_API_BASE: ${PAYMOB_API_BASE:-}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-}
  SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-}
  # Operational alerts are checked and sent by the app instances (src/ops/alerts.ts).
  ALERT_EMAILS: ${ALERT_EMAILS:-}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  ALERT_CHECK_INTERVAL_MS: ${ALERT_CHECK_INTERVAL_MS:-}
  # AI assistance (docs/AI_LAYER.md); off unless AI_PROVIDER is set.
  AI_PROVIDER: ${AI_PROVIDER:-none}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_API_BASE: ${AI_API_BASE:-}
  AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
  AI_MAX_RETRIES: ${AI_MAX_RETRIES:-}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-}
  AI_USER_DAILY_LIMIT: ${AI_USER_DAILY_LIMIT:-}

services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      # Required by the bundled database only (the ops scripts check it); unused with a managed one.
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-}
      DB_NAME: ${DB_NAME}
      DB_OWNER_USER: ${DB_OWNER_USER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_SYSTEM_USER: ${DB_SYSTEM_USER:-midad_system}
      DB_SYSTEM_PASSWORD: ${DB_SYSTEM_PASSWORD:-}
      DB_BACKUP_USER: ${DB_BACKUP_USER:-midad_backup}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host by default; uncomment for local tooling.
    # ports: ["127.0.0.1:5432:5432"]

  # APP_IMAGE_TAG picks the image: "local" is the one built here; a rebuild (scripts/rolling-restart.sh
  # --build, or the start script's) keeps the one it replaces as "previous", for a rollback (DEPLOYMENT_GUIDE §4).
  migrate:
    build: .
    image: midad:${APP_IMAGE_TAG:-local}
    command: ["sh", "-c", "node dist/db/migrate-cli.js up && node dist/db/seed-cli.js --catalog-only"]
    logging: *logging
    environment: *env-migrate
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"

  app:
    image: midad:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *logging
    environment: *env-web
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: midad:${APP_IMAGE_TAG:-local}
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      # The worker has no HTTP server; healthy means a recent heartbeat in the database.
      test: ["CMD", "node", "dist/cli/worker-health.js"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment: *env-runtime
    depends_on:
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.33@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
